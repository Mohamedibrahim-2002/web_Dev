<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in | Welcome</title>
<link rel="stylesheet" href="signup.css">
<script src="login.js" defer></script>
</head>
<body>
<main class="card">
<p class="eyebrow">Welcome back</p><h1>Log in to your account</h1>
<p class="intro">Enter your details to continue.</p>
<form id="login-form" action="#" method="post">
<div class="field"><label for="email">Email address</label><input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required></div>
<div class="field"><label for="password">Password</label><input type="password" name="password" id="password" placeholder="Your password" autocomplete="current-password" required></div>
<button type="submit">Log in <span aria-hidden="true">→</span></button>
<p class="form-message" id="form-message" role="status" aria-live="polite"></p>
</form>
<p class="account-link">New here? <a href="signUpForm.html">Create an account</a></p>
</main>
</body>
</html>
