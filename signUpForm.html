<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your account with our simple registration form.">
<title>Create your account | Registration</title>
<link rel="stylesheet" href="signup.css">
<script src="signup.js" defer></script>
</head>
<body>
<main class="card">
<p class="eyebrow">Welcome aboard</p><h1>Create your account</h1>
<p class="intro">Join us in just a minute. Fill in your details below to get started.</p>
<form id="signup-form" action="#" method="post">
<div class="field"><label for="name">Full name</label><input type="text" name="name" id="name" placeholder="e.g. Alex Johnson" autocomplete="name" required></div>
<div class="field"><label for="email">Email address</label><input type="email" name="email" id="email" placeholder="you@example.com" autocomplete="email" required><p class="hint">We’ll use this to send your confirmation.</p></div>
<div class="field"><label for="age">Age</label><input type="number" name="age" id="age" min="13" max="120" placeholder="Enter your age" inputmode="numeric" required></div>
<fieldset><legend>Gender <span class="hint">(optional)</span></legend><div class="choices"><label class="choice"><input type="radio" name="gender" value="male"> Male</label><label class="choice"><input type="radio" name="gender" value="female"> Female</label><label class="choice"><input type="radio" name="gender" value="other"> Prefer not to say</label></div></fieldset>
<button type="submit">Create account <span aria-hidden="true">→</span></button><p class="form-message" id="form-message" role="status" aria-live="polite"></p><p class="privacy">By continuing, you agree to our terms and privacy policy.</p>
</form>
</main>
</body>
</html>
